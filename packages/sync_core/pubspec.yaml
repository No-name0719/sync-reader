name: sync_core
description: >-
  SyncReader 同步核心：纯 Dart 包（无 Flutter 依赖）。同步状态机、差异计算、
  LWW 冲突合并、传输队列与 BackendAdapter 抽象（WebDAV / 自建 REST 双实现）。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  # 仅允许纯 Dart 依赖；禁止引入 Flutter（CLAUDE.md §2）。
  meta: ^1.16.0
  # 下载断点续传的 SHA-256 完整性校验（docs/04 §5.4）；纯 Dart。
  crypto: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.26.0
