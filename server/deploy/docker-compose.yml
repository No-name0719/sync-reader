# docs/06 §4.1 推荐部署形态
services:
  sync-reader-server:
    image: syncreader/server:1 # 或 ghcr.io/<you>/sync-reader-server
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sync-reader
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      SINGLE_USER: "true" # 家用单用户；多用户设 false 并用 CLI 建号
      REGISTRATION_OPEN: "false"
      JWT_SECRET: "change-me-64hex" # 首次生成后固定；留空则自动生成并持久化到 /data
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "/app/serverctl", "health", "--port", "8080"]
      interval: 30s
      timeout: 5s
      retries: 3
