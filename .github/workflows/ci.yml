# CI（M0 出口标准：analyze/test/build，CLAUDE.md §7）。
# 三个工程各自独立流水线；推送与 PR 均触发。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-core:
    # 纯 Dart 包：无 Flutter 依赖，用 Dart SDK 直接跑（更快）。
    name: sync_core (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sync_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  app-android:
    # 客户端 + Android 空壳构建（ubuntu runner 自带 Android SDK）。
    name: app (analyze + test + apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sync_reader
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build apk --debug

  app-windows:
    # Windows 桌面空壳构建（runner 自带 VS C++ 工具链）。
    name: app (build windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sync_reader
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug

  server:
    # Go 服务端：vet + build + test（docs/06）。
    name: server (vet + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
